[project]
name = "shoppilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI-projects-coder", email = "manikantakondapalli9498@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-pubsub>=2.44.0",
    "google-cloud-run>=0.16.3",
    "google-cloud-storage>=3.17.1",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shoppilot = "shoppilot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
